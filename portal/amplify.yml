version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm
            - pnpm install
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: portal/.next
        files:
          - '**/*'
      cache:
        paths:
          - portal/.next/cache/**/*
          - portal/node_modules/**/*
    appRoot: portal