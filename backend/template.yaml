AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Jubilee eKYC backend

Parameters:
  JubileeESBAPICredentials:
    Type: String
    Default: '{"username":"your-username","password":"your-password","business":"your-business","baseurl":"https://example.com"}'
    NoEcho: true
    Description: Jubilee ESB API Credentials in Secrets Manager
  PortalGraphQLCredentials:
    Type: String
    Default: '{"api_key":"graphql-api-key","url":"https://example.com"}'
    NoEcho: true
    Description: Port app-sync graphql credentials
Globals:
  Function:
    Timeout: 300
    MemorySize: 128
    Tracing: Active
    Runtime: python3.11
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON
Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: ApiGateway
      Description: Jubilee eKYC Application Gateway
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: { }
        paths:
          /faceliveness:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FaceLivenessFn.Arn}/invocations
              responses: { }
          /uploaddocument:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadDocumentFn.Arn}/invocations
              responses: { }
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        AllowMethods: '''POST,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''https://main.d2896e60a8d7f8.amplifyapp.com'''
        MaxAge: '''3600'''
  JubileeESBAPISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-jubilee-esb-api-credentials
      Description: Jubilee ESB API Credentials
      SecretString: !Ref JubileeESBAPICredentials
  PortalGraphQLSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-portal-graphql-credentials
      Description: Portal GraphQL API Credentials
      SecretString: !Ref PortalGraphQLCredentials
  UploadDocumentFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Process for handling KYC document upload
      CodeUri: process/functions/updloaddocument/src
      Handler: app.handler
      Environment:
        Variables:
          NEWDOCUMENTREGISTRATION_STATE_MACHINE_NAME: !GetAtt NewDocumentRegistration.Name
          NEWDOCUMENTREGISTRATION_STATE_MACHINE_ARN: !Ref NewDocumentRegistration
          DOCUMENTTEXTRACT_FUNCTION_NAME: !Ref DocumentTextract
          DOCUMENTTEXTRACT_FUNCTION_ARN: !GetAtt DocumentTextract.Arn
      Events:
        ApiGatewayPOSTuploaddocument:
          Type: Api
          Properties:
            Path: /uploaddocument
            Method: POST
            RestApiId: !Ref ApiGateway
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt NewDocumentRegistration.Name
        - LambdaInvokePolicy:
            FunctionName: !Ref DocumentTextract
  UploadDocumentFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UploadDocumentFn}
      RetentionInDays: 30
  FaceLivenessFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Process for checking faceliveness
      CodeUri: process/functions/faceliveness/src
      Handler: app.handler
      Environment:
        Variables:
          FACELIVENESSRESULTS_TABLE_NAME: !Ref FaceLivenessResults
          FACELIVENESSRESULTS_TABLE_ARN: !GetAtt FaceLivenessResults.Arn
          FACE_LIVENESS_CONFIDENCE_THRESHOLD: 95
      Events:
        ApiGatewayPOSTfaceliveness:
          Type: Api
          Properties:
            Path: /faceliveness
            Method: POST
            RestApiId: !Ref ApiGateway
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FaceLivenessResults
  FaceLivenessFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${FaceLivenessFn}
      RetentionInDays: 30
  JubileeESBCallFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Jubilee ESB IPRS,LexisNexis and KRA verification
      CodeUri: core/functions/jubilee_esb_call/src
      Handler: app.handler
      Environment:
        Variables:
          JUBILEE_ESB_API_SECRET_ARN: !Ref JubileeESBAPISecret
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref JubileeESBAPISecret
                - !Ref PortalGraphQLSecret
        - AWSLambdaBasicExecutionRole
      Layers:
        - !Ref JubileeESBAPILayer
  JubileeESBCallFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${JubileeESBCallFn}
      RetentionInDays: 30
  DocumentTextract:
    Type: AWS::Serverless::Function
    Properties:
      Description: Extract of form fields from documents
      CodeUri: core/functions/document_textract/src
      Handler: app.handler
      Environment: { }
  DocumentTextractLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${DocumentTextract}
      RetentionInDays: 30
  FaceLivenessResults:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  NewDocumentRegistrationStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: StepFunctionsDescribeAndStopExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:DescribeExecution
                  - states:StopExecution
                Resource: '*'
        - PolicyName: StepFunctionsEventBridgePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DeleteRule
                  - events:RemoveTargets
                  - events:DescribeRule
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule*
  NewDocumentRegistration:
    Type: AWS::Serverless::StateMachine
    Properties:
      Role: !GetAtt NewDocumentRegistrationStateMachineRole.Arn
      Definition:
        StartAt: DocumentExtraction
        States:
          DocumentExtraction:
            Type: Task
            Resource: arn:aws:states:::states:startExecution.sync:2
            Parameters:
              StateMachineArn: ${DocumentExtractArn}
              Input:
                StatePayload: Hello from Step Functions!
                AWS_STEP_FUNCTIONS_STARTED_BY_EXECUTION_ID.$: $$.Execution.Id
            Next: SearchIPRS
          SearchIPRS:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            OutputPath: $.Payload
            Parameters:
              Payload.$: $
              FunctionName: ${IPRSIdentityVerificationArn}
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 1
                MaxAttempts: 3
                BackoffRate: 2
            Next: Parallel
          Parallel:
            Type: Parallel
            Branches:
              - StartAt: LexisNexisSearchRecord
                States:
                  LexisNexisSearchRecord:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    OutputPath: $.Payload
                    Parameters:
                      Payload.$: $
                      FunctionName: ${LexisNexisBackgroundChecksArn}
                    Retry:
                      - ErrorEquals:
                          - Lambda.ServiceException
                          - Lambda.AWSLambdaException
                          - Lambda.SdkClientException
                          - Lambda.TooManyRequestsException
                        IntervalSeconds: 1
                        MaxAttempts: 3
                        BackoffRate: 2
                    End: true
              - StartAt: KRAValidateIDNumberFn
                States:
                  KRAValidateIDNumberFn:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    OutputPath: $.Payload
                    Parameters:
                      Payload.$: $
                      FunctionName: ${KRATaxComplianceVerificationArn}
                    Retry:
                      - ErrorEquals:
                          - Lambda.ServiceException
                          - Lambda.AWSLambdaException
                          - Lambda.SdkClientException
                          - Lambda.TooManyRequestsException
                        IntervalSeconds: 1
                        MaxAttempts: 3
                        BackoffRate: 2
                    End: true
            End: true
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt NewDocumentRegistrationLogGroup.Arn
      Tracing:
        Enabled: true
      Type: STANDARD
      DefinitionSubstitutions:
        DocumentExtractArn: !GetAtt DocumentExtract.Arn
        KRATaxComplianceVerificationArn: !GetAtt JubileeESBCallFn.Arn
        IPRSIdentityVerificationArn: !Ref JubileeESBCallFn
        LexisNexisBackgroundChecksArn: !GetAtt JubileeESBCallFn.Arn
  NewDocumentRegistrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/vendedlogs/states/${AWS::StackName}-${ResourceId}-Logs
        - ResourceId: NewDocumentRegistration
  DocumentExtract:
    Type: AWS::Serverless::StateMachine
    Properties:
      Definition:
        StartAt: LambdaTask
        States:
          LambdaTask:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              Payload.$: $
              FunctionName: ${LambdaFunction1}
            End: true
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt DocumentExtractLogGroup.Arn
      Policies:
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'
        - LambdaInvokePolicy:
            FunctionName: !Ref DocumentTextract
      Tracing:
        Enabled: true
      Type: EXPRESS
      DefinitionSubstitutions:
        LambdaFunction1: !GetAtt DocumentTextract.Arn
  DocumentExtractLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/vendedlogs/states/${AWS::StackName}-${ResourceId}-Logs
        - ResourceId: DocumentExtract
  JubileeESBAPILayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Layer ${ResourceName}
        - ResourceName: JubileeESBAPILayer
      ContentUri: core/layers/jubilee_esb_api_layer/src
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11
Metadata:
  AWS::Composer::Groups:
    Group:
      Label: 'Layer1: API Gateway'
      Members:
        - ApiGateway
    Group2:
      Label: 'Layer2: Process orchestration'
      Members:
        - FaceLivenessFn
        - UploadDocumentFn
        - NewDocumentRegistration
        - FaceLivenessResults
    Group3:
      Label: 'Layer3a: KYC Capture'
      Members:
        - DocumentExtract
    Group4:
      Label: 'Layer3b: KYC Validation'
      Members:
        - JubileeESBCallFn
        - JubileeESBAPILayer
    Group5:
      Label: Secrets
      Members:
        - JubileeESBAPISecret
        - PortalGraphQLSecret
Outputs:
  JubileeESBAPISecretARN:
    Description: ARN of the Jubilee ESB API Secret
    Value: !Ref JubileeESBAPISecret
  PortalGraphQLSecretARN:
    Description: ARN of the Portal GraphQL Secret
    Value: !Ref PortalGraphQLSecret
  UploadDocumentFnLogGroup:
    Description: Tailing the Upload documents search Logs
    Value: !Sub sam logs --profile shinrai.devpost --cw-log-group
      ${UploadDocumentFnLogGroup} --tail --filter "- platform - botocore"  | cut
      -d ' ' -f 3-
  JubileeESBCallFnLogGroup:
    Description: Tailing the Jubilee EBS Logs
    Value: !Sub sam logs --profile shinrai.devpost --cw-log-group
      ${JubileeESBCallFnLogGroup} --tail --filter "- platform - botocore"  | cut
      -d ' ' -f 3-