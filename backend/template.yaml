    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Stage
  FaceLivenessFnLogGroup:
    Description: Facelivess Logs
    Value: !Ref FaceLivenessFnLogGroup
  GovernmentVerificationFnLogGroup:
    Description: Identity verification service log group
    Value: !Ref GovernmentVerificationFnLogGroup
  DocumentValidationFnLogGroup:
    Description: Document validation log group
    Value: !Ref DocumentValidationFnLogGroup
  RegistrationFnLogGroup:
    Description: Registration log group
