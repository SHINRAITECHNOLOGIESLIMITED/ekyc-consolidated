AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Jubilee eKYC backend

Parameters:
  CognitoUserPoolArn:
    Type: String
    Default: 'arn:aws:cognito-idp:eu-west-1:842206816107:userpool/eu-west-1_eMNIDFsxx'
    Description: ARN of the existing Cognito User Pool for API authorization
  
  AmplifyS3BucketName:
    Type: String
    Default: 'amplify-d2896e60a8d7f8-ma-kycdocumentsbucketa4bf11-aae1vuopf1xq'
    Description: Name of the Amplify S3 bucket where KYC documents are upload into by portal

  JubileeESBAPICredentials:
    Type: String
    Default: '{"username":"your-username","password":"your-password","business":"your-business","baseurl":"https://example.com"}'
    NoEcho: true
    Description: Jubilee ESB API Credentials in Secrets Manager
  PortalGraphQLCredentials:
    Type: String
    Default: '{"api_key":"graphql-api-key","url":"https://example.com"}'
    NoEcho: true
    Description: Port app-sync graphql credentials
Globals:
  Function:
    Timeout: 300
    MemorySize: 128
    Tracing: Active
    Runtime: python3.11
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON
Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: ApiGateway
      Description: Jubilee eKYC Application Gateway
      StageName: Prod
      Auth:
        DefaultAuthorizer: LambdaTokenAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
            Identity:
              Header: Authorization
          LambdaTokenAuthorizer:
            FunctionArn: !GetAtt AuthFAuthorizerFnn.Arn
            Identity:
              Headers:
                - Authorization
            AuthorizerPayloadFormatVersion: 2.0
            EnableSimpleResponses: true
        AddDefaultAuthorizerToCorsPreflight: false
      DefinitionBody:
        openapi: '3.0'
        info: {}
        securityDefinitions:
          CognitoAuthorizer:
            type: apiKey
            name: Authorization
            in: header
            x-amazon-apigateway-authtype: cognito_user_pools
            x-amazon-apigateway-authorizer:
              type: cognito_user_pools
              providerARNs:
                - !Ref CognitoUserPoolArn
        paths:
          /faceliveness:
            options:
              summary: CORS support
              description: Enable CORS by returning correct headers
              responses:
                '200':
                  description: Default response for CORS method
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
                  content: {}
              x-amazon-apigateway-integration:
                type: mock
                responses:
                  default:
                    statusCode: 200
                    responseParameters:
                      method.response.header.Access-Control-Allow-Methods: '''POST,OPTIONS'''
                      method.response.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
                      method.response.header.Access-Control-Allow-Origin: '''https://main.d2896e60a8d7f8.amplifyapp.com'''
                requestTemplates:
                  application/json: '{"statusCode": 200}'
            post:
              security:
                - CognitoAuthorizer: [] 
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FaceLivenessFn.Arn}/invocations
              responses:
                '200':
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
          /uploaddocument:
            options:
              summary: CORS support
              description: Enable CORS by returning correct headers
              responses:
                '200':
                  description: Default response for CORS method
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
                  content: {}
              x-amazon-apigateway-integration:
                type: mock
                responses:
                  default:
                    statusCode: 200
                    responseParameters:
                      method.response.header.Access-Control-Allow-Methods: '''POST,OPTIONS'''
                      method.response.header.Access-Control-Allow-Headers: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
                      method.response.header.Access-Control-Allow-Origin: '''https://main.d2896e60a8d7f8.amplifyapp.com'''
                requestTemplates:
                  application/json: '{"statusCode": 200}'
            post:
              security:
                - CognitoAuthorizer: [] 
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadDocumentFn.Arn}/invocations
              responses:
                '200':
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        AllowMethods: POST,OPTIONS
        AllowHeaders: Content-Type,Authorization,X-Api-Key,X-Amz-Security-Token
        AllowOrigin: https://main.d2896e60a8d7f8.amplifyapp.com,http://localhost:3000
  JubileeESBAPISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-jubilee-esb-api-credentials
      Description: Jubilee ESB API Credentials
      SecretString: !Ref JubileeESBAPICredentials
  PortalGraphQLSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-portal-graphql-credentials
      Description: Portal GraphQL API Credentials
      SecretString: !Ref PortalGraphQLCredentials
  UploadDocumentFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Process for handling KYC document upload
      CodeUri: process/functions/updloaddocument/src
      Handler: app.handler
      Environment:
        Variables:
          NEWDOCUMENTREGISTRATION_STATE_MACHINE_NAME: !GetAtt NewDocumentRegistration.Name
          NEWDOCUMENTREGISTRATION_STATE_MACHINE_ARN: !Ref NewDocumentRegistration
          KYCDOCUMENTSBUCKET_NAME: !Ref KYCDocumentsBucket
          KYCDOCUMENTSBUCKET_ARN: !GetAtt KYCDocumentsBucket.Arn
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          AMPLIFY_S3_BUCKET_NAME: !Ref AmplifyS3BucketName
      Events:
        ApiGatewayPOSTuploaddocument:
          Type: Api
          Properties:
            Path: /uploaddocument
            Method: POST
            RestApiId: !Ref ApiGateway
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - AWSLambdaBasicExecutionRole
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt NewDocumentRegistration.Name
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectAcl
                - s3:GetObjectLegalHold
                - s3:GetObjectRetention
                - s3:GetObjectTorrent
                - s3:GetObjectVersion
                - s3:GetObjectVersionAcl
                - s3:GetObjectVersionForReplication
                - s3:GetObjectVersionTorrent
                - s3:ListBucket
                - s3:ListBucketMultipartUploads
                - s3:ListBucketVersions
                - s3:ListMultipartUploadParts
                - s3:AbortMultipartUpload
                - s3:DeleteObject
                - s3:DeleteObjectVersion
                - s3:PutObject
                - s3:PutObjectLegalHold
                - s3:PutObjectRetention
                - s3:RestoreObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}/*
                - !Sub arn:${AWS::Partition}:s3:::${AmplifyS3BucketName}
                - !Sub arn:${AWS::Partition}:s3:::${AmplifyS3BucketName}/*
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt NewDocumentRegistration.Name
      Layers:
        - !Ref PortalProjectionLayer
  UploadDocumentFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UploadDocumentFn}
      RetentionInDays: 30
  FaceLivenessFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Process for checking faceliveness
      CodeUri: process/functions/faceliveness/src
      Handler: app.handler
      Environment:
        Variables:
          FACELIVENESSRESULTS_TABLE_NAME: !Ref FaceLivenessResults
          FACELIVENESSRESULTS_TABLE_ARN: !GetAtt FaceLivenessResults.Arn
          FACE_LIVENESS_CONFIDENCE_THRESHOLD: 95
      Events:
        ApiGatewayPOSTfaceliveness:
          Type: Api
          Properties:
            Path: /faceliveness
            Method: POST
            RestApiId: !Ref ApiGateway
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - DynamoDBCrudPolicy:
            TableName: !Ref FaceLivenessResults
      Layers:
        - !Ref PortalProjectionLayer
  FaceLivenessFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${FaceLivenessFn}
      RetentionInDays: 30
  AuthorizerFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Authorizer function
      CodeUri: process/functions/authorizer/src
      Handler: app.handler
  AuthorizerFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AuthorizerFn}
      RetentionInDays: 30
  JubileeESBCallFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Jubilee ESB IPRS,LexisNexis and KRA verification
      CodeUri: core/functions/jubilee_esb_call/src
      Handler: app.handler
      Environment:
        Variables:
          JUBILEE_ESB_API_SECRET_ARN: !Ref JubileeESBAPISecret
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref JubileeESBAPISecret
                - !Ref PortalGraphQLSecret
        - AWSLambdaBasicExecutionRole
      Layers:
        - !Ref JubileeESBAPILayer
        - !Ref PortalProjectionLayer
  JubileeESBCallFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${JubileeESBCallFn}
      RetentionInDays: 30
  DocumentTextractFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Extract of form fields from documents
      CodeUri: core/functions/document_textract/src
      Handler: app.handler
      Environment:
        Variables:
          KYCDOCUMENTSBUCKET_NAME: !Ref KYCDocumentsBucket
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          KYCDOCUMENTSBUCKET_ARN: !GetAtt KYCDocumentsBucket.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - textract:DetectDocumentText
                - textract:GetDocumentAnalysis
                - textract:GetDocumentTextDetection
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectAcl
                - s3:GetObjectLegalHold
                - s3:GetObjectRetention
                - s3:GetObjectTorrent
                - s3:GetObjectVersion
                - s3:GetObjectVersionAcl
                - s3:GetObjectVersionForReplication
                - s3:GetObjectVersionTorrent
                - s3:ListBucket
                - s3:ListBucketMultipartUploads
                - s3:ListBucketVersions
                - s3:ListMultipartUploadParts
                - s3:AbortMultipartUpload
                - s3:DeleteObject
                - s3:DeleteObjectVersion
                - s3:PutObject
                - s3:PutObjectLegalHold
                - s3:PutObjectRetention
                - s3:RestoreObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}/*
      Layers:
        - !Ref PortalProjectionLayer
  DocumentTextractFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${DocumentTextractFn}
      RetentionInDays: 30
  FaceLivenessResults:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  NewDocumentRegistration:
    Type: AWS::Serverless::StateMachine
    Properties:
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt NewDocumentRegistrationLogGroup.Arn
      Tracing:
        Enabled: true
      Type: EXPRESS
      DefinitionSubstitutions:
        DocumentExtractArn: !GetAtt DocumentTextractFn.Arn
        JubileeESBCallFnArn: !GetAtt JubileeESBCallFn.Arn
        NewDocumentRegistrationResultsTableName: !Ref NewDocumentRegistrationResults
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DocumentTextractFn
        - LambdaInvokePolicy:
            FunctionName: !Ref JubileeESBCallFn
        - CloudWatchLogsFullAccess
      DefinitionUri: process/state_machines/new_document_registration.yaml
  NewDocumentRegistrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/vendedlogs/states/${AWS::StackName}-${ResourceId}-Logs
        - ResourceId: NewDocumentRegistration
  JubileeESBAPILayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Jubilee ESB API Layer
      ContentUri: core/layers/jubilee_esb_api_layer/src
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11
  PortalProjectionLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Projecting backend events into portal using graphql
      ContentUri: shared/portal_project/src
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11
  KYCDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-kycdocume-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
      PublicAccessBlockConfiguration:
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  KYCDocumentsBucketBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KYCDocumentsBucket
      PolicyDocument:
        Id: RequireEncryptionInTransit
        Version: '2012-10-17'
        Statement:
          - Principal: '*'
            Action: '*'
            Effect: Deny
            Resource:
              - !GetAtt KYCDocumentsBucket.Arn
              - !Sub ${KYCDocumentsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  NewDocumentRegistrationResults:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
Metadata:
  AWS::Composer::Groups:
    Group:
      Label: 'Layer1: API Gateway'
      Members:
        - ApiGateway
    Group2:
      Label: 'Layer2: Process orchestration'
      Members:
        - FaceLivenessFn
        - UploadDocumentFn
        - FaceLivenessResults
        - KYCDocumentsBucket
        - NewDocumentRegistration
        - NewDocumentRegistrationResults
    Group4:
      Label: 'Layer3b: KYC Validation (Core)'
      Members:
        - JubileeESBCallFn
        - JubileeESBAPILayer
    Group5:
      Label: Secrets
      Members:
        - JubileeESBAPISecret
        - PortalGraphQLSecret
Outputs:
  DocumentTextractFnLogGroup:
    Description: Tailing the documents textract Logs
    Value: !Sub sam logs --profile shinrai.devpost --cw-log-group
      ${DocumentTextractFnLogGroup} --tail --filter "- platform - botocore"  |
      cut -d ' ' -f 3-
  JubileeESBCallFnLogGroup:
    Description: Tailing the Jubilee EBS Logs
    Value: !Sub sam logs --profile shinrai.devpost --cw-log-group
      ${JubileeESBCallFnLogGroup} --tail --filter "- platform - botocore"  | cut
      -d ' ' -f 3-
  FaceLivenessFnLogGroup:
    Description: Tailing the Facelivess Logs
    Value: !Sub sam logs --profile shinrai.devpost --cw-log-group
      ${FaceLivenessFnLogGroup} --tail --filter "- platform - botocore"  | cut
      -d ' ' -f 3-
  UploadDocumentFnLogGroup:
    Description: Tailing the upload document GW endpoint Logs
    Value: !Sub sam logs --profile shinrai.devpost --cw-log-group
      ${UploadDocumentFnLogGroup} --tail --filter "- platform - botocore"  | cut
      -d ' ' -f 3-