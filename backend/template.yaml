AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Jubilee eKYC backend

Parameters:
  AmplifyS3BucketName:
    Type: String
    Default: amplify-dnw02dhxhpu7h-mai-kycdocumentsbucketa4bf11-wxhjqijfdzdz
    Description: Name of the Amplify S3 bucket where KYC documents are upload into by portal
  AmplifyDynamoDBCustomerRegistrationTable:
    Type: String
    Default: Customer-7s7oergeyvc23jelhjmhef4uki-NONE
    Description: Name of the Amplify DynamoDb Table with customer registrations
  AmplifyDynamoDBAgentRegistrationTable:
    Type: String
    Default: Agent-7s7oergeyvc23jelhjmhef4uki-NONE
    Description: Name of the Amplify DynamoDb Table with agent registrations
  AmplifyCognitoUserPoolId:
    Type: String
    Default: eu-west-1_zn9jaZ2zR
    Description: Cognito userpool id
  IrelandCognitoUserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:eu-west-1:851725215817:userpool/eu-west-1_Ggp07MyBe
    Description: Ireland Cognito User Pool ARN
  JubileeESBAPICredentials:
    Type: String
    Default: '{"username":"your-username","password":"your-password","business":"your-business","baseurl":"https://example.com"}'
    NoEcho: true
    Description: Jubilee ESB API Credentials in Secrets Manager
  PortalGraphQLCredentials:
    Type: String
    Default: '{"api_key":"graphql-api-key","url":"https://example.com"}'
    NoEcho: true
    Description: Port app-sync graphql credentials
Globals:
  Function:
    Timeout: 300
    MemorySize: 128
    Tracing: Active
    Runtime: python3.11
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON
Resources:
  JubileeESBAPISecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-jubilee-esb-ApiGateway-credentials
      Description: Jubilee ESB API Credentials
      SecretString: !Ref JubileeESBAPICredentials
  PortalGraphQLSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-portal-graphql-credentials
      Description: Portal GraphQL API Credentials
      SecretString: !Ref PortalGraphQLCredentials
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: APIGateway-jubilee-eKYC
      StageName: Prod
      Description: API Gateway for Jubilee eKYC
      # Auth:
      #   DefaultAuthorizer: AWS_IAM
      #   Authorizers:
      #     CognitoAuthorizer:
      #       UserPoolArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${AmplifyCognitoUserPoolId}
      #       Identity:
      #         Header: Authorization
      #     LambdaAuthorizer:
      #       FunctionArn: !GetAtt AuthorizerFn.Arn
      #       IdentitySource: method.request.header.Authorization
      #       Name: LambdaAuthorizer
      # AddDefaultAuthorizerToCorsPreflight: false
      DefinitionBody: !Transform
        Name: AWS::Include
        Parameters:
          Location: openapi.yaml
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        AllowOrigin: '''*'''
        AllowHeaders: '''Content-Type, Authorization, X-Api-Key, X-Amz-Date,
          X-Amz-Security-Token'''
        AllowMethods: '''GET, POST, OPTIONS'''
        MaxAge: 60
      OpenApiVersion: 3.0.1

  AuthorizerFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Lambda Authorizer Function
      CodeUri: shared/functions/authorizer/src
      Handler: app.handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref AmplifyCognitoUserPoolId

  AuthorizerFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AuthorizerFn}
      RetentionInDays: 30
  RegistrationFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Handles agent and customer registration
      CodeUri: process/functions/registration/src
      Handler: app.handler
      Environment:
        Variables:
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          CUSTOMERREGISTRATIONSM_NAME: !GetAtt CustomerRegistrationSM.Name
          CUSTOMERREGISTRATIONSM_ARN: !Ref CustomerRegistrationSM
          AGENTREGISTRATIONSM_NAME: !GetAtt AgentRegistrationSM.Name
          AGENTREGISTRATIONSM_ARN: !Ref AgentRegistrationSM
      Events:
        ApiGatewayPOSTAgentRegistration:
          Type: Api
          Properties:
            Path: /agent-registration
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTCustomerRegistration:
          Type: Api
          Properties:
            Path: /customer-registration
            Method: POST
            RestApiId: !Ref ApiGateway

      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt CustomerRegistrationSM.Name
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt AgentRegistrationSM.Name
      Layers:
        - !Ref PortalProjectionLayer

  RegistrationFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${RegistrationFn}
      RetentionInDays: 30

  KYCOrchestratorFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Consolidated KYC processing endpoint - orchestrates complete KYC workflow with SOW security features
      CodeUri: core/functions/kyc_orchestrator/src
      Handler: app.handler
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          DOCUMENT_VALIDATION_FUNCTION: !Ref DocumentValidationFn
          GOVERNMENT_VERIFICATION_FUNCTION: !Ref GovernmentVerificationFn
          BACKGROUND_CHECK_FUNCTION: !Ref BackgroundChecksFn
          FACE_LIVENESS_FUNCTION: !Ref FaceLivenessFn
          CERTIFICATION_FUNCTION: !Ref CertificationFn
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          COGNITO_USER_POOL_ID: !Ref AmplifyCognitoUserPoolId
      Policies:
        - AWSLambdaBasicExecutionRole
        - LambdaInvokeFunction
        - Statement:
            - Sid: CognitoMFAManagement
              Effect: Allow
              Action:
                - cognito-idp:AdminSetUserMFAPreference
                - cognito-idp:UpdateUserPool
                - cognito-idp:DescribeUserPool
                - cognito-idp:AssociateSoftwareToken
                - cognito-idp:VerifySoftwareToken
                - cognito-idp:SetUserMFAPreference
                - cognito-idp:GetUser
                - cognito-idp:AdminGetUser
              Resource:
                - !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${AmplifyCognitoUserPoolId}
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt DocumentValidationFn.Arn
                - !GetAtt GovernmentVerificationFn.Arn
                - !GetAtt BackgroundChecksFn.Arn
                - !GetAtt FaceLivenessFn.Arn
                - !GetAtt CertificationFn.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
            - Sid: FeatureFlagAccess
              Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jubilee/kyc/feature-flags/*
      Events:
        ApiGatewayPOSTKYCProcess:
          Type: Api
          Properties:
            Path: /kyc/process
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTKYC2FA:
          Type: Api
          Properties:
            Path: /kyc/2fa
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTKYCUnified:
          Type: Api
          Properties:
            Path: /kyc
            Method: POST
            RestApiId: !Ref ApiGateway
      Layers:
        - !Ref PortalProjectionLayer

  KYCOrchestratorFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${KYCOrchestratorFn}
      RetentionInDays: 30

  DocumentValidationFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Validating that uploaded documents match the provided data
      CodeUri: core/functions/document_validation/src
      Handler: app.handler
      Environment:
        Variables:
          KYCDOCUMENTSBUCKET_NAME: !Ref KYCDocumentsBucket
          KYCDOCUMENTSBUCKET_ARN: !GetAtt KYCDocumentsBucket.Arn
          AMPLIFY_S3_BUCKET_NAME: !Ref AmplifyS3BucketName
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
      Events:
        ApiGatewayPOSTKRA:
          Type: Api
          Properties:
            Path: /document/krapincertificate
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTID:
          Type: Api
          Properties:
            Path: /document/nationalid
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTPassport:
          Type: Api
          Properties:
            Path: /document/passport
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTCompany:
          Type: Api
          Properties:
            Path: /document/cr12
            Method: POST
            RestApiId: !Ref ApiGateway
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectAcl
                - s3:GetObjectLegalHold
                - s3:GetObjectRetention
                - s3:GetObjectTorrent
                - s3:GetObjectVersion
                - s3:GetObjectVersionAcl
                - s3:GetObjectVersionForReplication
                - s3:GetObjectVersionTorrent
                - s3:ListBucket
                - s3:ListBucketMultipartUploads
                - s3:ListBucketVersions
                - s3:ListMultipartUploadParts
                - s3:AbortMultipartUpload
                - s3:DeleteObject
                - s3:DeleteObjectVersion
                - s3:PutObject
                - s3:PutObjectLegalHold
                - s3:PutObjectRetention
                - s3:RestoreObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
                - s3:HeadObject
                - s3:ListBucket
                - s3:ListBucketVersions
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${AmplifyS3BucketName}
                - !Sub arn:${AWS::Partition}:s3:::${AmplifyS3BucketName}/*
        - Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - textract:DetectDocumentText
                - textract:GetDocumentAnalysis
                - textract:GetDocumentTextDetection
              Resource: '*'
      Layers:
        - !Ref PortalProjectionLayer
        - !Ref DocumentTextractLayer
  DocumentValidationFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${DocumentValidationFn}
      RetentionInDays: 30
  GovernmentVerificationFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Calls to external identity services to validate supplied data
        verification
      CodeUri: core/functions/government_verification/src
      Handler: app.handler
      Environment:
        Variables:
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          JUBILEE_ESB_API_SECRET_ARN: !Ref JubileeESBAPISecret
          JUBILEEAPICACHE_TABLE_NAME: !Ref JubileeApiCache
          JUBILEEAPICACHE_TABLE_ARN: !GetAtt JubileeApiCache.Arn
      Events:
        ApiGatewayPOSTKRA:
          Type: Api
          Properties:
            Path: /government/kra
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTID:
          Type: Api
          Properties:
            Path: /government/nationalid
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGatewayPOSTPassport:
          Type: Api
          Properties:
            Path: /government/passport
            Method: POST
            RestApiId: !Ref ApiGateway
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
                - !Ref JubileeESBAPISecret
        - DynamoDBCrudPolicy:
            TableName: !Ref JubileeApiCache
      Layers:
        - !Ref PortalProjectionLayer
        - !Ref JubileeESBAPILayer
  GovernmentVerificationFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GovernmentVerificationFn}
      RetentionInDays: 30
  BackgroundChecksFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Handles background checking against Lexis Nexis API
      CodeUri: core/functions/background_check/src
      Handler: app.lambda_handler
      Environment:
        Variables:
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          JUBILEE_ESB_API_SECRET_ARN: !Ref JubileeESBAPISecret
          JUBILEEAPICACHE_TABLE_NAME: !Ref JubileeApiCache
          JUBILEEAPICACHE_TABLE_ARN: !GetAtt JubileeApiCache.Arn
      Events:
        ApiGatewayPOSTBackgroundCheck:
          Type: Api
          Properties:
            Path: /backgroundcheck
            Method: POST
            RestApiId: !Ref ApiGateway
      Layers:
        - !Ref PortalProjectionLayer
        - !Ref JubileeESBAPILayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
                - !Ref JubileeESBAPISecret
        - DynamoDBCrudPolicy:
            TableName: !Ref JubileeApiCache
  BackgroundChecksFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${BackgroundChecksFn}
      RetentionInDays: 30
  CertificationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub certification-bucket-${AWS::StackName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
      PublicAccessBlockConfiguration:
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CertificationFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Created PDF KYC certificates
      CodeUri: core/functions/certification/src
      Handler: app.handler
      Environment:
        Variables:
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          CERTIFICATION_BUCKET_NAME: !Ref CertificationBucket
          CERTIFICATION_BUCKET_ARN: !GetAtt CertificationBucket.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectAcl
                - s3:GetObjectLegalHold
                - s3:GetObjectRetention
                - s3:GetObjectTorrent
                - s3:GetObjectVersion
                - s3:GetObjectVersionAcl
                - s3:GetObjectVersionForReplication
                - s3:GetObjectVersionTorrent
                - s3:ListBucket
                - s3:ListBucketMultipartUploads
                - s3:ListBucketVersions
                - s3:ListMultipartUploadParts
                - s3:AbortMultipartUpload
                - s3:DeleteObject
                - s3:DeleteObjectVersion
                - s3:PutObject
                - s3:PutObjectLegalHold
                - s3:PutObjectRetention
                - s3:RestoreObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${CertificationBucket}
                - !Sub arn:${AWS::Partition}:s3:::${CertificationBucket}/*

      Layers:
        - !Ref PortalProjectionLayer
  CertificationFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${CertificationFn}
  FaceLivenessFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: core/functions/face_liveness/src
      Handler: app.handler
      Environment:
        Variables:
          FACELIVENESSRESULTS_TABLE_NAME: !Ref FaceLivenessResults
          FACELIVENESSRESULTS_TABLE_ARN: !GetAtt FaceLivenessResults.Arn
          FACE_LIVENESS_CONFIDENCE_THRESHOLD: 70
          PORTAL_GRAPHQL_SECRET_ARN: !Ref PortalGraphQLSecret
          LIVENESSCAPTUREBUCKET_BUCKET_NAME: !Ref FaceLivenessCaptureBucket
          LIVENESSCAPTUREBUCKET_BUCKET_ARN: !GetAtt FaceLivenessCaptureBucket.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref PortalGraphQLSecret
        - DynamoDBCrudPolicy:
            TableName: !Ref FaceLivenessResults
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:CreateFaceLivenessSession
                - rekognition:GetFaceLivenessSessionResults
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectAcl
                - s3:GetObjectLegalHold
                - s3:GetObjectRetention
                - s3:GetObjectTorrent
                - s3:GetObjectVersion
                - s3:GetObjectVersionAcl
                - s3:GetObjectVersionForReplication
                - s3:GetObjectVersionTorrent
                - s3:ListBucket
                - s3:ListBucketMultipartUploads
                - s3:ListBucketVersions
                - s3:ListMultipartUploadParts
                - s3:AbortMultipartUpload
                - s3:DeleteObject
                - s3:DeleteObjectVersion
                - s3:PutObject
                - s3:PutObjectLegalHold
                - s3:PutObjectRetention
                - s3:RestoreObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${FaceLivenessCaptureBucket}
                - !Sub arn:${AWS::Partition}:s3:::${FaceLivenessCaptureBucket}/*
      Layers:
        - !Ref PortalProjectionLayer
      Events:
        ApiGatewayPOSTfaceliveness:
          Type: Api
          Properties:
            Path: /faceliveness
            Method: POST
            RestApiId: !Ref ApiGateway
  FaceLivenessFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${FaceLivenessFn}
      RetentionInDays: 30
  DocumentStreamingFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Streams documents directly from S3 through API Gateway
      CodeUri: core/functions/document_streaming/src
      Handler: app.handler
      Environment:
        Variables:
          KYCDOCUMENTSBUCKET_NAME: !Ref KYCDocumentsBucket
          LIVENESSCAPTUREBUCKET_BUCKET_NAME: !Ref FaceLivenessCaptureBucket
          CERTIFICATION_BUCKET_NAME: !Ref CertificationBucket
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}
                - !Sub arn:${AWS::Partition}:s3:::${KYCDocumentsBucket}/*
                - !Sub arn:${AWS::Partition}:s3:::${FaceLivenessCaptureBucket}
                - !Sub arn:${AWS::Partition}:s3:::${FaceLivenessCaptureBucket}/*
                - !Sub arn:${AWS::Partition}:s3:::${CertificationBucket}
                - !Sub arn:${AWS::Partition}:s3:::${CertificationBucket}/*
      Events:
        ApiGatewayPOSTfaceliveness:
          Type: Api
          Properties:
            Path: /stream/{bucketType}/{documentKey+}
            Method: GET
            RestApiId: !Ref ApiGateway

  DocumentStreamingFnLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${DocumentStreamingFn}
      RetentionInDays: 30
  FaceLivenessResults:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FaceLivenessSessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiry_time
        Enabled: true
  FaceLivenessCaptureBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub faceliveness-captures-${AWS::StackName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
      PublicAccessBlockConfiguration:
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  DocumentTextractLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Textract Layer
      ContentUri: core/layers/document_textract/src
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11
  JubileeESBAPILayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Jubilee ESB API Layer
      ContentUri: core/layers/jubilee_esb_api_layer/src
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11
  PortalProjectionLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Projecting backend events into portal using graphql
      ContentUri: shared/layers/portal_project/src
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11
  KYCDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kyc-raw-documents-${AWS::StackName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
      PublicAccessBlockConfiguration:
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  KYCDocumentsBucketBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KYCDocumentsBucket
      PolicyDocument:
        Id: RequireEncryptionInTransit
        Version: '2012-10-17'
        Statement:
          - Principal: '*'
            Action: '*'
            Effect: Deny
            Resource:
              - !GetAtt KYCDocumentsBucket.Arn
              - !Sub ${KYCDocumentsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  CustomerRegistrationSM:
    Type: AWS::Serverless::StateMachine
    Properties:
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CustomerRegistrationSMLogGroup.Arn
      Policies:
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt DocumentValidationFn.Arn
                - !GetAtt GovernmentVerificationFn.Arn
                - !GetAtt BackgroundChecksFn.Arn
                - !GetAtt CertificationFn.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref AmplifyDynamoDBCustomerRegistrationTable
      Tracing:
        Enabled: true
      Type: STANDARD
      DefinitionSubstitutions:
        DocumentValidation: !Ref DocumentValidationFn
        GovernmentVerification: !Ref GovernmentVerificationFn
        BackgroundChecks: !Ref BackgroundChecksFn
        Certification: !Ref CertificationFn
        CustomerRegitrationTable: !Ref AmplifyDynamoDBCustomerRegistrationTable
      DefinitionUri: process/state_machines/customer_registration.yaml
  CustomerRegistrationSMLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /aws/vendedlogs/states/${AWS::StackName}-${ResourceId}-Logs
        - ResourceId: CustomerRegistrationSM
  AgentRegistrationSM:
    Type: AWS::Serverless::StateMachine
    Properties:
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt AgentRegistrationSMLogGroup.Arn
      Policies:
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt DocumentValidationFn.Arn
                - !GetAtt GovernmentVerificationFn.Arn
                - !GetAtt BackgroundChecksFn.Arn
                - !GetAtt CertificationFn.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref AmplifyDynamoDBAgentRegistrationTable
      Tracing:
        Enabled: true
      Type: STANDARD
      DefinitionSubstitutions:
        DocumentValidation: !Ref DocumentValidationFn
        GovernmentVerification: !Ref GovernmentVerificationFn
        BackgroundChecks: !Ref BackgroundChecksFn
        Certification: !Ref CertificationFn
        AgentRegitrationTable: !Ref AmplifyDynamoDBAgentRegistrationTable
      DefinitionUri: process/state_machines/agent_registration.yaml
  AgentRegistrationSMLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - /aws/vendedlogs/states/${AWS::StackName}-${ResourceId}-Logs
        - ResourceId: AgentRegistrationSM
  JubileeApiCache:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JubileeApiCache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiry_time
        Enabled: true
Metadata:
  AWS::Composer::Groups:
    Group2:
      Label: 'Layer2: Process orchestration'
      Members:
        - GovernmentVerificationFn
        - DocumentValidationFn
        - FaceLivenessFn
        - FaceLivenessResults
        - KYCDocumentsBucket
        - RegistrationFn
        - CustomerRegistrationSM
        - AgentRegistrationSM
        - JubileeApiCache
        - FaceLivenessCaptureBucket
Outputs:
  ApiGatewayUrl:
