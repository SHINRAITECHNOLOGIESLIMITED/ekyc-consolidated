QueryLanguage: "JSONata"
StartAt: Choice
States:
  Choice:
    Type: Choice
    QueryLanguage: "JSONata"
    Choices:
      - Condition: '{% $states.input.agentType = "Individual" %}'
        Next: National ID Document Validation
      - Condition: '{% $states.input.agentType = "Business" %}'
        Next: CR12 Document Validation
    Default: Unknown Agent Type Failure
  Unknown Agent Type Failure:
    Type: Fail
    Error: UnknownAgentType
    Cause: unknown agentType
  CR12 Document Validation:
    Type: Task
    QueryLanguage: "JSONata"
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${DocumentValidation}
      Payload:
        httpMethod: POST
        path: /document/nationalid
        body:
          uploadedDocumentUrl: '{% $states.input.companyCertificateUrl %}'
          businessNumber: '{% $states.input.businessNumber %}'
          businessName: '{% $states.input.name %}'
    Assign:
      registration: '{% $states.input %}'
      cr12Validation: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: CR12 Document Validation
          failureReason: Failed during CR12 document validation
    Next: UpdateCR12Validated
  UpdateCR12Validated:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: SET kycStatus = :kycStatus
      ExpressionAttributeValues:
        ':kycStatus':
          S: CR12 Document Validated
    Next: Certify and Persist Business Agent
  Certify and Persist Business Agent:
    Type: Task
    QueryLanguage: "JSONata"
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${Certification}
      Payload:
        httpMethod: POST
        path: /certification/business_agent_registration
        body:
          registration: '{% $registration %}'
          cr12Validation: '{% $cr12Validation %}'
    Assign:
      certification: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: Business Agent Certificate Generation
          failureReason: Failed during business agent certificate generation
    Next: UpdateBusinessAgentCertificateCreated
  UpdateBusinessAgentCertificateCreated:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: SET kycStatus = :kycStatus, kycCertificateS3Path = :kycCertificateS3Path
      ExpressionAttributeValues:
        ':kycStatus':
          S: Agent Certificate Created
        ':kycCertificateS3Path':
          S: '{% $certification.s3Path %}'
    End: true
  National ID Document Validation:
    Type: Task
    QueryLanguage: "JSONata"
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${DocumentValidation}
      Payload:
        httpMethod: POST
        path: /document/nationalid
        body:
          uploadedDocumentUrl: '{% $states.input.nationalIdCardUrl %}'
          idNumber: '{% $states.input.idNumber %}'
          fullNames: '{% $states.input.name %}'
          dateOfBirth: '{% $states.input.dateOfBirth %}'
    Assign:
      registration: '{% $states.input %}'
      idValidation: '{% $parse($states.result.Payload.body) %}'
      nationalIdValidation: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: National ID Document Validation
          failureReason: Failed during national ID document validation
    Next: UpdateNationalIDValidated
  UpdateNationalIDValidated:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: SET kycStatus = :kycStatus
      ExpressionAttributeValues:
        ':kycStatus':
          S: National ID Doc Validated
    Next: ID Verification
  ID Verification:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    QueryLanguage: "JSONata"
    Arguments:
      FunctionName: ${GovernmentVerification}
      Payload:
        httpMethod: POST
        path: /government/nationalid
        body:
          idNumber: '{% $registration.idNumber %}'
          fullNames: '{% $registration.name %}'
          dateOfBirth: '{% $registration.dateOfBirth %}'
    Assign:
      idVerification: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: ID Verification
          failureReason: Failed during government ID verification
    Next: UpdateNationalIDVerified
  UpdateNationalIDVerified:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: SET kycStatus = :kycStatus
      ExpressionAttributeValues:
        ':kycStatus':
          S: National ID Verified
    Next: TaxPayer Verification
  TaxPayer Verification:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    QueryLanguage: "JSONata"
    Arguments:
      FunctionName: ${GovernmentVerification}
      Payload:
        httpMethod: POST
        path: /government/kra
        body:
          idNumber: '{% $registration.idNumber %}'
          pin: '{% $registration.pinNumber %}'
          taxPayerName: '{% $registration.name %}'
    Assign:
      taxPayerVerification: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: TaxPayer Verification
          failureReason: Failed during KRA taxpayer verification
    Next: UpdateTaxPayerInfoVerified
  UpdateTaxPayerInfoVerified:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: SET kycStatus = :kycStatus
      ExpressionAttributeValues:
        ':kycStatus':
          S: Tax Payer Info Verified
    Next: Background Check
  Background Check:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    QueryLanguage: "JSONata"
    Arguments:
      FunctionName: ${BackgroundChecks}
      Payload:
        httpMethod: POST
        body:
          firstName: '{% $split($registration.name, " ")[0] %}'
          lastName: '{% $split($registration.name, " ")[-1] %}'
          dateOfBirth: '{% $registration.dateOfBirth %}'
          gender: '{% $registration.gender %}'
          nationalIdentificationNumber: '{% $registration.idNumber %}'
    Assign:
      backgroundCheck: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: Background Check
          failureReason: Failed during background check with LexisNexis
    Next: UpdateBackGroundCheckDone
  UpdateBackGroundCheckDone:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: SET kycStatus = :kycStatus
      ExpressionAttributeValues:
        ':kycStatus':
          S: Background Check Completed
    Next: Certify and Persist Individual Agent
  Certify and Persist Individual Agent:
    Type: Task
    QueryLanguage: "JSONata"
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${Certification}
      Payload:
        httpMethod: POST
        path: /certification/individual_agent_registration
        body:
          registration: '{% $registration %}'
          nationalIdValidation: '{% $nationalIdValidation %}'
          idVerification: '{% $idVerification %}'
          taxPayerVerification: '{% $taxPayerVerification %}'
          backgroundCheck: '{% $backgroundCheck %}'
    Assign:
      certification: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: Individual Agent Certificate Generation
          failureReason: Failed during individual agent certificate generation
    Next: UpdateIndividualAgentCertificateCreated
  UpdateIndividualAgentCertificateCreated:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: SET kycStatus = :kycStatus, kycCertificateS3Path = :kycCertificateS3Path
      ExpressionAttributeValues:
        ':kycStatus':
          S: Agent Certificate Created
        ':kycCertificateS3Path':
          S: '{% $certification.s3Path %}'
    End: true
  Flag For Manual Review:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${AgentRegitrationTable}
      Key:
        agentId:
          S: '{% $registration.agentId %}'
      UpdateExpression: "SET kycStatus = :kycStatus, manualReviewRequired = :manualReviewRequired, failedStep = :failedStep, failureReason = :failureReason, failedAt = :failedAt"
      ExpressionAttributeValues:
        ":kycStatus":
          S: "Manual Review Required"
        ":manualReviewRequired":
          BOOL: true
        ":failedStep":
          S: '{% $failedStep %}'
        ":failureReason":
          S: '{% $failureReason %}'
        ":failedAt":
          S: '{% $now() %}'
    End: true
