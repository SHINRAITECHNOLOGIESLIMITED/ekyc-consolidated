StartAt: InvokeTextract
States:
  InvokeTextract:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      Payload.$: $
      FunctionName: ${DocumentExtractArn}
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    OutputPath: $.Payload
    Next: SearchJubileeEBS
  SearchJubileeEBS:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    Parameters:
      Payload.$: $
      FunctionName: ${JubileeESBCallFnArn}
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    OutputPath: $.Payload
    Next: KYCVerification
  KYCVerification:
    Type: Pass
    Next: PersistNewDocumentRegistration
    Comment: 'Todo: Compare the infromation from Textract vs thsy  from EBSSearch
      and verify they alligned'
  PersistNewDocumentRegistration:
    Type: Task
    Resource: arn:aws:states:::dynamodb:putItem
    Parameters:
      TableName: ${NewDocumentRegistrationResultsTableName}
      Item:
        documentId:
          S.$: $.documentId
        customerId:
          S.$: $.customerId
        documentType:
          S.$: $.documentType
        s3Path:
          S.$: $.s3Path
        bucket:
          S.$: $.bucket
        extractedData:
          S.$: $.extractedData
        document:
          S.$: $.document
        search_iprs:
          S.$: $.search_iprs
        search_kra:
          S.$: $.search_kra
        lexisNexis:
          S.$: $.search_lexisnexis
        processTimestamp:
          S.$: $.State.EnteredTime
    Retry:
      - ErrorEquals:
          - DynamoDB.ServiceException
          - DynamoDB.ProvisionedThroughputExceededException
          - DynamoDB.ResourceNotFoundException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    ResultPath: $.databaseEntry
    End: true