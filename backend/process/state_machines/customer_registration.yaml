QueryLanguage: "JSONata"
StartAt: National ID Document Validation
States:
  National ID Document Validation:
    Type: Task
    QueryLanguage: "JSONata"
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${DocumentValidation}
      Payload:
        httpMethod: POST
        path: /document/nationalid
        body:
          uploadedDocumentUrl: '{% $states.input.nationalIdCardUrl %}'
          idNumber: '{% $states.input.idNumber %}'
          fullNames: '{% $states.input.name %}'
          dateOfBirth: '{% $states.input.dateOfBirth %}'
          gender: '{% $states.input.gender %}'
    Assign:
      registration: '{% $states.input %}'
      idValidation: '{% $parse($states.result.Payload.body) %}'
      nationalIdValidation: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: National ID Document Validation
          failureReason: Failed during national ID document validation
    Next: UpdateNationalIDValidated
  UpdateNationalIDValidated:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${CustomerRegitrationTable}
      Key:
        customerId:
          S: '{% $registration.customerId %}'
      UpdateExpression: "SET kycStatus = :kycStatus"
      ExpressionAttributeValues:
        ":kycStatus":
          S: "National ID Doc Validated"
    Next: ID Verification
  ID Verification:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    QueryLanguage: "JSONata"
    Arguments:
      FunctionName: ${GovernmentVerification}
      Payload:
        httpMethod: POST
        path: /government/nationalid
        body:
          idNumber: '{% $registration.idNumber %}'
          fullNames: '{% $registration.name %}'
          dateOfBirth: '{% $registration.dateOfBirth %}'
          gender: '{% $registration.gender %}'
    Assign:
      idVerification: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: ID Verification
          failureReason: Failed during government ID verification
    Next: UpdateNationalIDVerified
  UpdateNationalIDVerified:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${CustomerRegitrationTable}
      Key:
        customerId:
          S: '{% $registration.customerId %}'
      UpdateExpression: "SET kycStatus = :kycStatus"
      ExpressionAttributeValues:
        ":kycStatus":
          S: "National ID Verified"
    Next: TaxPayer Verification
  TaxPayer Verification:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    QueryLanguage: "JSONata"
    Arguments:
      FunctionName: ${GovernmentVerification}
      Payload:
        httpMethod: POST
        path: /government/kra
        body:
          idNumber: '{% $registration.idNumber %}'
          pin: '{% $registration.pinNumber %}'
          taxPayerName: '{% $registration.name %}'
    Assign:
      taxPayerVerification: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: TaxPayer Verification
          failureReason: Failed during KRA taxpayer verification
    Next: UpdateTaxPayerInfoVerified
  UpdateTaxPayerInfoVerified:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${CustomerRegitrationTable}
      Key:
        customerId:
          S: '{% $registration.customerId %}'
      UpdateExpression: "SET kycStatus = :kycStatus"
      ExpressionAttributeValues:
        ":kycStatus":
          S: "Tax Payer Info Verified"
    Next: Background Check
  Background Check:
    Type: Task
    Resource: arn:aws:states:::lambda:invoke
    QueryLanguage: "JSONata"
    Arguments:
      FunctionName: ${BackgroundChecks}
      Payload:
        httpMethod: POST
        body:
          firstName: '{% $split($registration.name, " ")[0] %}'
          lastName: '{% $split($registration.name, " ")[-1] %}'
          gender: '{% $registration.gender %}'
          dateOfBirth: '{% $registration.dateOfBirth %}'
          nationalIdentificationNumber: '{% $registration.idNumber %}'
    Assign:
      backgroundCheck: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: Background Check
          failureReason: Failed during background check with LexisNexis
    Next: UpdateBackGroundCheckDone
  UpdateBackGroundCheckDone:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${CustomerRegitrationTable}
      Key:
        customerId:
          S: '{% $registration.customerId %}'
      UpdateExpression: "SET kycStatus = :kycStatus"
      ExpressionAttributeValues:
        ":kycStatus":
          S: "Background Check Completed"
    Next: Certify and Persist
  Certify and Persist:
    Type: Task
    QueryLanguage: "JSONata"
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${Certification}
      Payload:
        httpMethod: POST
        path: /certification/customer_registration
        body:
          registration: '{% $registration %}'
          nationalIdValidation: '{% $nationalIdValidation %}'
          idVerification: '{% $idVerification %}'
          taxPayerVerification: '{% $taxPayerVerification %}'
          backgroundCheck: '{% $backgroundCheck %}'
    Assign:
      certification: '{% $parse($states.result.Payload.body) %}'
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    Catch:
      - ErrorEquals:
          - States.ALL
        Next: Flag For Manual Review
        ResultPath: $.error
        Assign:
          failedStep: Certificate Generation
          failureReason: Failed during certificate generation
    Next: UpdateCustomerCertificateCreated
  UpdateCustomerCertificateCreated:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${CustomerRegitrationTable}
      Key:
        customerId:
          S: '{% $registration.customerId %}'
      UpdateExpression: "SET kycStatus = :kycStatus, kycCertificateS3Path = :kycCertificateS3Path"
      ExpressionAttributeValues:
        ":kycStatus":
          S: "Customer Certificate Created"
        ":kycCertificateS3Path":
          S: '{% $certification.s3Path %}'
    End: true
  Flag For Manual Review:
    Type: Task
    Resource: arn:aws:states:::dynamodb:updateItem
    QueryLanguage: "JSONata"
    Arguments:
      TableName: ${CustomerRegitrationTable}
      Key:
        customerId:
          S: '{% $registration.customerId %}'
      UpdateExpression: "SET kycStatus = :kycStatus, manualReviewRequired = :manualReviewRequired, failedStep = :failedStep, failureReason = :failureReason, failedAt = :failedAt"
      ExpressionAttributeValues:
        ":kycStatus":
          S: "Manual Review Required"
        ":manualReviewRequired":
          BOOL: true
        ":failedStep":
          S: '{% $failedStep %}'
        ":failureReason":
          S: '{% $failureReason %}'
        ":failedAt":
          S: '{% $now() %}'
    End: true
